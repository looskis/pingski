name: Release

# Triggered by pushing a tag such as v0.1.0 (scripts/release.sh does this).
# Builds universal (arm64 + x86_64) archives, runs the tests, publishes a GitHub release with the
# archives, SHA256SUMS and a formula carrying the real sha256. With the optional TAP_GITHUB_TOKEN
# secret (a fine-grained PAT with Contents and Pull requests write access to looskis/homebrew-tap)
# it also pushes a pingski-<version> branch to the tap and merges the pull request into its
# protected main. The looskis org disables deploy keys, so without the token run
# scripts/update-tap.sh locally instead.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ github.ref_name }}
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      TAP_REPO: looskis/homebrew-tap
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Version.swift
        run: |
          version="$(sed -n 's/.*pingskiVersion = "\(.*\)".*/\1/p' Sources/pingski/Version.swift)"
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match Version.swift ($version)"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Unit tests
        run: make test

      - name: Build universal archives
        run: |
          make dist
          lipo -archs build/Pingski.app/Contents/MacOS/pingski
          tar -C build/dist -xzf "build/dist/pingski-$VERSION-macos-universal.tar.gz"
          "build/dist/pingski-$VERSION-macos-universal/bin/pingski" --version | grep -q "$VERSION"
          rm -rf "build/dist/pingski-$VERSION-macos-universal"

      - name: Formula with release sha256
        run: |
          sha="$(shasum -a 256 "build/dist/pingski-$VERSION-macos-universal.tar.gz" | cut -d' ' -f1)"
          sed -i '' \
            -e "s|/releases/download/v[0-9.]*/pingski-[0-9.]*-macos-universal.tar.gz|/releases/download/$TAG/pingski-$VERSION-macos-universal.tar.gz|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$sha\"|" Formula/pingski.rb
          brew style Formula/pingski.rb
          cp Formula/pingski.rb build/dist/pingski.rb
          {
            echo "## Homebrew formula"
            echo
            echo "Tarball sha256: \`$sha\`"
            echo
            echo '```ruby'; cat Formula/pingski.rb; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release notes
        run: |
          # Section of CHANGELOG.md for this version, or a generic line if there is none.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; found = ($0 ~ "\\[" v "\\]" || $0 ~ "^## " v) ; next }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Pingski $VERSION" > notes.md
          cat >> notes.md <<MD

          ## Install

          Homebrew (prebuilt universal binary):

          \`\`\`sh
          brew install looskis/tap/pingski
          \`\`\`

          Manual: download \`pingski-$VERSION-macos-universal.tar.gz\`, extract it anywhere and run
          \`bin/pingski\`, or drop \`Pingski.app\` from the zip into /Applications. Archives downloaded with
          a browser carry the quarantine flag; clear it with \`xattr -dr com.apple.quarantine <path>\`.
          Verify downloads against \`SHA256SUMS\`.
          MD

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="build/dist/pingski-$VERSION-macos-universal.tar.gz build/dist/Pingski-$VERSION.zip
                  build/dist/SHA256SUMS build/dist/pingski.rb"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run on an existing tag: replace the assets and notes in place.
            gh release upload "$TAG" --clobber $assets
            gh release edit "$TAG" --title "Pingski $VERSION" --notes-file notes.md
          else
            gh release create "$TAG" --title "Pingski $VERSION" --notes-file notes.md $assets
          fi

      - name: Publish formula to the tap
        run: |
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo "TAP_GITHUB_TOKEN is not set; publish the formula with: scripts/update-tap.sh $VERSION" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export GH_TOKEN="$TAP_GITHUB_TOKEN"
          git clone "https://x-access-token:$TAP_GITHUB_TOKEN@github.com/$TAP_REPO.git" tap
          cp Formula/pingski.rb tap/Formula/pingski.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "pingski-$VERSION"
          git add Formula/pingski.rb
          if git diff --cached --quiet; then
            echo "formula already up to date in $TAP_REPO"
            exit 0
          fi
          git commit -m "pingski $VERSION"
          git push --force -u origin "pingski-$VERSION"
          body="Updates the Pingski formula to $VERSION (https://github.com/${{ github.repository }}/releases/tag/$TAG)."
          pr="$(gh pr list --repo "$TAP_REPO" --head "pingski-$VERSION" --json url --jq '.[0].url')"
          if [ -z "$pr" ]; then
            pr="$(gh pr create --repo "$TAP_REPO" --head "pingski-$VERSION" --base main \
                    --title "pingski $VERSION" --body "$body")"
          fi
          gh pr merge "$pr" --repo "$TAP_REPO" --squash --delete-branch
          echo "merged $pr" | tee -a "$GITHUB_STEP_SUMMARY"
